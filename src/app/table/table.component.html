    <tbody>
        <tr>
            <td>Aureliou</td>
            <td>Mthembu</td>
        </tr>

        </tr>

        <tr>
            <td>Ngqabutho</td>

        </tr>
        <tr>

            <td>Van heerden</td>

<h1>Draw table using variable data</h1>
<table>
    <tr>
        <th>Name</th>
        <th>Surname</th>
    </tr>
    <tr *ngFor="let b of surnames, let a of names">
        <td>{{a}}</td>
        <td>{{b}}</td>
    </tr>
</table>

<h1>Draw table using object data</h1>
<table>
    <thead>
        <button (click)="sortByName()">Sort by name</button>
        <tr>
             <th >Name </th>
            <th>Place</th>
            <th>Surname</th>
            <th>Networth</th>
            <th>Age</th>
        </tr>
    </thead>
    
    <tbody>
        <tr *ngFor="let q of learnerBio">
            <td>{{q.name}}</td>
            <td>{{q.location}}</td>
            <td>{{q.surname}}</td>
            <td>{{q.networth}}</td>
            <td>{{q.age}}</td>
        </tr>

        
    </tbody>
</table>
